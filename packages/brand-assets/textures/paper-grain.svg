<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" aria-hidden="true">
  <!-- DOSA paper grain (vector source). Seamless via stitchTiles. Prefer the raster tiles for large
       surfaces: browsers re-rasterise turbulence on every resize. Apply at 3–5% opacity. -->
  <filter id="dosa-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.6" intercept="-0.3"/>
      <feFuncG type="linear" slope="1.6" intercept="-0.3"/>
      <feFuncB type="linear" slope="1.6" intercept="-0.3"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#dosa-grain)"/>
</svg>
